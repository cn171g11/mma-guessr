# ⚠️ 仅供本地开发/联调使用，禁止直接复用于生产部署！
# 生产环境必须：通过环境变量注入强随机密码、保持 127.0.0.1 回环绑定（切勿改回 0.0.0.0），
# 并在云厂商安全组/防火墙层限制来源 IP；密码取默认值时请按需在 .env 中覆盖。
services:
    postgres:
        image: postgres:16-alpine
        container_name: mma-guessr-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-mma}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mma}
            POSTGRES_DB: mma_guessr
            TZ: Asia/Shanghai
        # 仅绑定回环地址：即使宿主机部署在公网，PostgreSQL 也不会对公网暴露
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d mma_guessr']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: mma-guessr-redis
        restart: unless-stopped
        # 强制 requirepass：密码来自环境变量（后端 REDIS_URL 需带对应密码）
        command: redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-mma}
        # 仅绑定回环地址：Redis 不对公网暴露
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '$${REDIS_PASSWORD}', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
    redisdata:
