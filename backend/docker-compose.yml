services:
    postgres:
        image: postgres:16-alpine
        container_name: mma-guessr-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: mma
            POSTGRES_PASSWORD: mma
            POSTGRES_DB: mma_guessr
            TZ: Asia/Shanghai
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U mma -d mma_guessr']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: mma-guessr-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - '6379:6379'
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
    redisdata:
