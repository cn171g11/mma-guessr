# =============================================================
# MmaGuessr 生产环境 Compose（正式部署使用）
# ⚠️ 严禁直接复用仓库根目录 backend/docker-compose.yml（仅本地开发）！
#
# 安全要点（对应 docs/deploy.md 生产部署清单）：
#   1) 后端为 Go 单二进制（纯标准库 + SQLite，无外部服务依赖）
#   2) SQLite 数据文件挂载命名卷，随容器持久化
#   3) Nginx 反向代理对外只暴露 80 / 443，终结 HTTPS（证书挂 /etc/letsencrypt）
#   4) 所有密钥由 deploy/.env 注入，模板见 .env.prod.example（生成强随机值，勿留默认）
#   5) SQLite 定时备份由 scripts/backup-sqlite.sh（宿主 cron）负责
# =============================================================

services:
    backend:
        image: ghcr.io/cn171g11/mma-guessr-backend:latest
        container_name: mma-guessr-backend
        restart: unless-stopped
        env_file: .env
        # 无 ports 段：仅内网暴露 3000 给 Nginx
        volumes:
            - sqldata:/app/data
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    nginx:
        image: nginx:1.27-alpine
        container_name: mma-guessr-nginx
        restart: unless-stopped
        # 对外只暴露 80（自动跳转 HTTPS）与 443
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            # 服务器证书（Let's Encrypt），由宿主机或 certbot 容器写入
            - /etc/letsencrypt:/etc/letsencrypt:ro
            - ./frontend:/usr/share/nginx/html:ro
        depends_on:
            - backend

volumes:
    sqldata:
