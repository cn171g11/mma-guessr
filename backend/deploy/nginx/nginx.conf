# MmaGuessr 生产 Nginx 配置
# 由 docker-compose.prod.yml 挂载为 /etc/nginx/conf.d/default.conf
# 替换 __DOMAIN__ 为实际域名（部署脚本会做 sed，或手动改名）。

# 压缩（conf.d 文件被 include 进 http 上下文，指令在此生效）
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
gzip_vary on;

# 后端 API 上游（容器内 DNS 名）
upstream mma_backend {
    server backend:3000;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # ACME 挑战目录（Let's Encrypt）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # 证书与私钥（Let's Encrypt 证书路径）
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # TLS 强化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：内联脚本已迁移至 addEventListener（js/events.js），故 script-src 不含 'unsafe-inline'；
    # 与 index.html 中 meta CSP 保持一致（此处不含开发用 localhost 条目），并追加 upgrade-insecure-requests
    # 强制子资源走 HTTPS（页面级 CSP 由 Nginx 对 HTML 下发，此指令才真正生效）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.socket.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    client_max_body_size 1m;

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://mma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Socket.IO 反向代理（需升级协议） ----
    location /socket.io/ {
        proxy_pass http://mma_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 前端静态资源 ----
    # HTML 不缓存（每次取最新，避免发布后用户拿到旧壳）；
    # 引用的三方 CDN（unpkg/cdn.socket.io）自带缓存头，无需处理
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # 自研资源无内容哈希文件名，用短缓存 + ETag 平衡更新及时性与带宽
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}