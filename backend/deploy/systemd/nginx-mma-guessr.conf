# MmaGuessr 生产 Nginx 配置 —— systemd 单二进制部署形态
# 与 docker-compose 版（nginx/nginx.conf）唯一差异：
#   upstream 指向本机 127.0.0.1:3000；静态目录为 /var/www/mma-guessr。
# 安装：sed 替换 __DOMAIN__ 后放入 /etc/nginx/sites-available/ 并软链到 sites-enabled/。
# 证书路径：宿主 certbot（/etc/letsencrypt）签发的标准路径。

# 压缩
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
gzip_vary on;

# 后端 API 上游（本机 systemd 服务）
upstream mma_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # ACME 挑战目录（宿主 certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # TLS 强化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.socket.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    client_max_body_size 1m;

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://mma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Socket.IO 反向代理（需升级协议） ----
    location /socket.io/ {
        proxy_pass http://mma_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 前端静态资源 ----
    location = /index.html {
        root /var/www/mma-guessr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        root /var/www/mma-guessr;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / {
        root /var/www/mma-guessr;
        index index.html;
        try_files $uri $uri/ =404;
    }
}