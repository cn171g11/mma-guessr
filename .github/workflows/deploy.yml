name: Deploy

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'README.md'
            - 'CONTRIBUTING.md'
            - 'AGENTS.md'
            - 'p.md'
            - 'docs/**'
            - 'backend/**'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    validate:
        name: Pre-deploy validation
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies (Prettier)
              run: npm ci

            - name: Prettier code style
              run: npm run format:check

            - name: JS syntax check
              run: |
                  node --check src/js/config.js
                  node --check src/js/data.js
                  node --check src/js/game.js
                  for f in tools/*.js; do node --check "$f"; done

            - name: Location data validation
              run: node tools/validate-data.js
              env:
                  EXPECTED_LOCATIONS: 1570

    deploy:
        name: Deploy to GitHub Pages
        needs: validate
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            # Static site needs no build: assemble release artifacts into _site (upload-pages-artifact only accepts a directory)
            - name: Assemble release artifacts
              run: |
                  mkdir -p _site
                  cp -r frontend/index.html frontend/MmaGuessr.html frontend/src frontend/.nojekyll _site/
                  find _site -type f | sort

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v4