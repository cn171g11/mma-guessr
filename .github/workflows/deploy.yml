name: Deploy

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'README.md'
            - 'CONTRIBUTING.md'
            - 'AGENTS.md'
            - 'docs/**'
            - 'backend/**'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    validate:
        name: Pre-deploy validation
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Reject hardcoded Mapillary tokens
              working-directory: ${{ github.workspace }}
              run: |
                  if grep -rniE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=_site --exclude-dir=release 'MLY\|[0-9]{10,}\|[0-9A-Za-z]{20,}' .; then
                      echo "::error::Hardcoded Mapillary token detected. Rejecting commit. Use the environment variable MAPILLARY_TOKEN (server-side only) instead."
                      exit 1
                  fi
                  echo "no hardcoded Mapillary token found"

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies (Prettier)
              run: npm ci

            - name: Prettier code style
              run: npm run format:check

            - name: JS syntax check
              run: |
                  node --check src/js/config.js
                  node --check src/js/data.js
                  node --check src/js/api.js
                  node --check src/js/game.js
                  node --check src/js/auth.js
                  node --check src/js/lb.js
                  node --check src/js/daily.js
                  node --check src/js/mp.js
                  for f in tools/*.js; do node --check "$f"; done

            - name: Location data validation
              run: node tools/validate-data.js
              env:
                  EXPECTED_LOCATIONS: 1570

    deploy:
        name: Deploy to GitHub Pages
        needs: validate
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Configure GitHub Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

            # Static site needs no build: assemble release artifacts into _site (upload-pages-artifact only accepts a directory)
            - name: Assemble release artifacts
              run: |
                  mkdir -p _site
                  cp -r frontend/index.html frontend/MmaGuessr.html frontend/src frontend/.nojekyll _site/
                  find _site -type f | sort

            - name: Upload artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
              with:
                  path: _site

            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e