name: Street View Coverage Verification (manual)

on:
    workflow_dispatch:
        inputs:
            script:
                description: Target verification script (calls Mapillary API per point, slow)
                required: true
                type: choice
                default: verify-cn-streetview
                options:
                    - verify-cn-streetview
                    - verify-world-expand
                    - verify-world-expand2
            expectTotal:
                description: Expected total location count (default 1570)
                required: false
                type: string

permissions:
    contents: read

jobs:
    verify:
        name: Run ${{ inputs.script }}
        runs-on: ubuntu-latest
        timeout-minutes: 120
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 20

            - name: Location data pre-check
              run: node tools/validate-data.js
              env:
                  # Fallback to 1570 when not provided
                  EXPECTED_LOCATIONS: ${{ inputs.expectTotal != '' && inputs.expectTotal || '1570' }}

            - name: Run verification script
              run: node tools/${{ inputs.script }}.js
              env:
                  # The script only accepts the key from the environment; fails fast when secrets.MAPILLARY_TOKEN is unset
                  MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}

            - name: Upload verification report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: verify-report
                  path: |
                      frontend/tools/.verify-report.json
                      frontend/tools/.world-expand-report.json
                      frontend/tools/.world-expand-report2.json
                  if-no-files-found: ignore