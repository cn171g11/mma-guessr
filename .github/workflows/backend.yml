name: Backend CI/CD

on:
    push:
        branches:
            - main
        paths:
            - 'backend/**'
            - '.github/workflows/backend.yml'
            - '.github/workflows/deploy.yml'
    pull_request:
        paths:
            - 'backend/**'
            - '.github/workflows/backend.yml'
            - '.github/workflows/deploy.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: backend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: TS 检查 / Lint / 构建
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 安装 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: 安装依赖
              run: npm ci

            - name: 类型检查
              run: npm run typecheck

            - name: ESLint
              run: npm run lint

            - name: Prettier
              run: npm run format:check

            - name: 构建
              run: npm run build

    integration:
        name: 集成验证 PG + Redis / health
        needs: check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        env:
            NODE_ENV: development
            DATABASE_URL: postgres://mma:mma@localhost:5432/mma_guessr
            REDIS_URL: redis://localhost:6379
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: mma
                    POSTGRES_PASSWORD: mma
                    POSTGRES_DB: mma_guessr
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mma -d mma_guessr"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 安装 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: 安装依赖
              run: npm ci

            - name: 构建
              run: npm run build

            - name: 启动服务并验证 /api/health
              run: |
                  node dist/index.js > server.log 2>&1 &
                  SERVER_PID=$!
                  RESP=""
                  for i in $(seq 1 20); do
                      sleep 1
                      if RESP=$(curl -fsS http://localhost:3000/api/health 2>/dev/null); then
                          break
                      fi
                  done
                  kill "$SERVER_PID" 2>/dev/null || true
                  echo "health 响应：${RESP:-<无响应>}"
                  echo "$RESP" | grep -q '"status":"ok"' && echo "✅ 集成验证通过"
                  if ! echo "$RESP" | grep -q '"status":"ok"'; then
                      cat server.log
                      exit 1
                  fi

    docker:
        name: 构建并推送镜像(GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.tags }}
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 登录 GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 提取镜像元数据
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-backend
                  tags: |
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: 构建并推送
              uses: docker/build-push-action@v6
              with:
                  context: backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max