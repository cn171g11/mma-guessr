name: Backend CI/CD

on:
    push:
        branches:
            - main
        paths:
            - 'backend/**'
            - '.github/workflows/backend.yml'
            - '.github/workflows/backend-checks.yml'
    pull_request:
        paths:
            - 'backend/**'
            - '.github/workflows/backend.yml'
            - '.github/workflows/backend-checks.yml'
    workflow_dispatch:
        inputs:
            mode:
                description: Manual scope (push runs the full Go suite by default)
                required: true
                type: choice
                default: test
                options:
                    - test
                    - image

permissions:
    contents: read

concurrency:
    group: backend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality (reusable)
        uses: ./.github/workflows/backend-checks.yml

    docker:
        name: Build and push image (GHCR)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'image'
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            actions: write
        outputs:
            image: ${{ steps.meta.outputs.tags }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Login to GHCR
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
              with:
                  images: ghcr.io/${{ github.repository }}-backend
                  tags: |
                      type=sha
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              with:
                  context: backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max