name: CI

on:
    push:
        branches:
            - main
        paths:
            - 'frontend/**'
            - '.github/workflows/ci.yml'
            - '.github/workflows/deploy.yml'
    pull_request:
        paths:
            - 'frontend/**'
            - '.github/workflows/ci.yml'
            - '.github/workflows/deploy.yml'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint / Syntax / Data validation
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies (Prettier)
              run: npm ci

            - name: Prettier code style
              run: npm run format:check

            - name: JS syntax check
              run: |
                  node --check src/js/config.js
                  node --check src/js/data.js
                  node --check src/js/api.js
                  node --check src/js/game.js
                  node --check src/js/auth.js
                  for f in tools/*.js; do node --check "$f"; done

            - name: Location data validation
              run: node tools/validate-data.js
              env:
                  EXPECTED_LOCATIONS: 1570