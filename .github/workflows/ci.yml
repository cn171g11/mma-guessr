name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: 规范 / 语法 / 数据校验
        runs-on: ubuntu-latest
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 安装 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 安装依赖(Prettier)
              run: npm ci

            - name: Prettier 代码风格
              run: npm run format:check

            - name: JS 语法检查
              run: |
                  node --check src/js/config.js
                  node --check src/js/data.js
                  node --check src/js/game.js
                  for f in tools/*.js; do node --check "$f"; done

            - name: 题库数据校验
              run: node tools/validate-data.js
              env:
                  EXPECTED_LOCATIONS: 1570
