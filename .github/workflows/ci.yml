name: CI

on:
    push:
        branches:
            - main
        paths:
            - 'frontend/**'
            - '.github/workflows/ci.yml'
            - '.github/workflows/deploy.yml'
    pull_request:
        paths:
            - 'frontend/**'
            - '.github/workflows/ci.yml'
            - '.github/workflows/deploy.yml'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint / Syntax / Data validation
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Reject hardcoded Mapillary tokens
              working-directory: ${{ github.workspace }}
              run: |
                  if grep -rniE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=_site --exclude-dir=release 'MLY\|[0-9]{10,}\|[0-9A-Za-z]{20,}' .; then
                      echo "::error::Hardcoded Mapillary token detected. Rejecting commit. Use the environment variable MAPILLARY_TOKEN (server-side only) instead."
                      exit 1
                  fi
                  echo "no hardcoded Mapillary token found"

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies (Prettier)
              run: npm ci

            - name: Prettier code style
              run: npm run format:check

            - name: JS syntax check
              run: |
                  node --check src/js/config.js
                  node --check src/js/data.js
                  node --check src/js/api.js
                  node --check src/js/game.js
                  node --check src/js/auth.js
                  node --check src/js/lb.js
                  node --check src/js/daily.js
                  node --check src/js/mp.js
                  node --check src/js/features.js
                  for f in tools/*.js; do node --check "$f"; done

            - name: Location data validation
              run: node tools/validate-data.js
              env:
                  EXPECTED_LOCATIONS: 1570