name: Backend Checks (Reusable)

on:
    workflow_call:
        inputs:
            runIntegration:
                description: Whether to run the full e2e suite (already Go-native, always runs)
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    check:
        name: Format / Vet / Build / Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Reject hardcoded Mapillary tokens
              working-directory: ${{ github.workspace }}
              run: |
                  if grep -rniE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=_site --exclude-dir=release 'MLY\|[0-9]{10,}\|[0-9A-Za-z]{20,}' .; then
                      echo "::error::Hardcoded Mapillary token detected. Rejecting commit. Use the environment variable MAPILLARY_TOKEN (server-side only) instead."
                      exit 1
                  fi
                  echo "no hardcoded Mapillary token found"

            - name: Setup Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
              with:
                  go-version-file: backend/go.mod
                  cache: true

            - name: Vet
              run: go vet ./...

            - name: Build
              run: go build ./...

            - name: Unit + e2e tests
              run: go test -count=1 ./...

            - name: Race detector suite
              run: go test -race -count=1 -timeout 300s ./test/
