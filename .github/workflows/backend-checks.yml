name: Backend Checks (Reusable)

on:
    workflow_call:
        inputs:
            runIntegration:
                description: Whether to run integration tests (PG + Redis full flow)
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    check:
        name: Typecheck / Lint / Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Prettier
              run: npm run format:check

            - name: Build
              run: npm run build

    integration:
        name: "Integration test: full auth flow (PG + Redis)"
        if: inputs.runIntegration
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        env:
            NODE_ENV: development
            DATABASE_URL: postgres://mma:mma@localhost:5432/mma_guessr
            REDIS_URL: redis://localhost:6379
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: mma
                    POSTGRES_PASSWORD: mma
                    POSTGRES_DB: mma_guessr
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mma -d mma_guessr"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run database migrations (users)
              run: npm run db:migrate

            - name: Run auth e2e tests (register/login/token/guest)
              run: npm test

            - name: Start server and verify /api/health
              run: |
                  node dist/index.js > server.log 2>&1 &
                  SERVER_PID=$!
                  HEALTH_RESP=""
                  for i in $(seq 1 20); do
                      sleep 1
                      if HEALTH_RESP=$(curl -fsS http://localhost:3000/api/health 2>/dev/null); then
                          break
                      fi
                  done
                  kill "$SERVER_PID" 2>/dev/null || true
                  echo "health response: ${HEALTH_RESP:-<no response>}"
                  echo "$HEALTH_RESP" | grep -q '"status":"ok"' && echo "Integration check passed."
                  if ! echo "$HEALTH_RESP" | grep -q '"status":"ok"'; then
                      cat server.log
                      exit 1
                  fi