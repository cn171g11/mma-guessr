name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version (e.g. 1.0.0). Whole-project release, deploys frontend to GitHub Pages, pushes multi-arch backend image ghcr.io/...-backend:1.0.0, creates tag v1.0.0 and attaches cross-platform artifacts
                required: true
                type: string
            includeIntegration:
                description: Run the full Go e2e suite (incl. race detector) before publishing
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    preflight:
        name: Preflight (version + tag availability)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  fetch-depth: 0

            - name: Validate version input
              run: |
                  if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::version must be a semantic version (e.g. 1.0.0)"
                      exit 1
                  fi

            - name: Ensure tag is not already released
              run: |
                  if git tag -l "v${{ inputs.version }}" | grep -q .; then
                      echo "::error::Tag v${{ inputs.version }} already exists. Pick a new version and re-run."
                      exit 1
                  fi
                  echo "OK: v${{ inputs.version }} is available"

    quality:
        name: Quality gates + integration tests
        needs: preflight
        uses: ./.github/workflows/backend-checks.yml
        with:
            runIntegration: ${{ inputs.includeIntegration }}

    # Cross-platform release artifacts: the frontend is a static package (deployable anywhere),
    # while the backend is a single Go binary built with CGO disabled (no runtime dependencies).
    artifacts:
        name: Build cross-platform artifacts
        needs: [preflight, quality]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Setup Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
              with:
                  go-version-file: backend/go.mod
                  cache: true

            - name: Build backend binaries (linux/darwin/windows, amd64+arm64)
              working-directory: backend
              run: |
                  mkdir -p release/bin
                  for TARGET in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64" "windows arm64"; do
                      set -- $TARGET
                      OUT="release/bin/mma-guessr-$1-$2"
                      if [ "$1" = "windows" ]; then OUT="$OUT.exe"; fi
                      GOOS=$1 GOARCH=$2 CGO_ENABLED=0 \
                        go build -trimpath -ldflags "-s -w -X main.version=${{ inputs.version }}" \
                        -o "$OUT" ./cmd/server
                  done
                  ls -la release/bin/

            - name: Package frontend (static site)
              working-directory: frontend
              run: |
                  mkdir -p release/frontend
                  cp -r index.html MmaGuessr.html src .nojekyll release/frontend/
                  (cd release/frontend && zip -rq ../mma-guessr-frontend-${{ inputs.version }}.zip .)

            - name: Package backend (Go binaries)
              working-directory: backend
              run: |
                  mkdir -p release/backend
                  cp -r release/bin .env.example release/backend/
                  (cd release/backend && zip -rq ../mma-guessr-backend-${{ inputs.version }}.zip .)

            - name: Collect artifacts and generate checksums
              run: |
                  mkdir -p release
                  cp frontend/release/mma-guessr-frontend-${{ inputs.version }}.zip release/
                  cp backend/release/mma-guessr-backend-${{ inputs.version }}.zip release/
                  cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

            - name: Upload release assets
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: release-assets
                  path: release/*
                  retention-days: 30

    # Release deploys the static frontend to GitHub Pages, mirroring the official flow in deploy.yml
    deploy-frontend:
        name: Deploy frontend to GitHub Pages
        needs: [preflight, quality]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Configure GitHub Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

            - name: Assemble site (frontend is static, no build)
              run: |
                  mkdir -p _site
                  cp -r frontend/index.html frontend/MmaGuessr.html frontend/src frontend/.nojekyll _site/
                  find _site -type f | sort

            - name: Upload artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
              with:
                  path: _site

            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

    publish:
        name: Multi-arch image / tag / GitHub Release
        needs: [preflight, artifacts, deploy-frontend]
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            packages: write
            actions: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  # Full history is needed to resolve the previous tag for the conventional-commit changelog
                  fetch-depth: 0

            - name: Set up QEMU (cross-platform build)
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

            - name: Login to GHCR
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
              with:
                  images: ghcr.io/${{ github.repository }}-backend
                  tags: |
                      type=raw,value=${{ inputs.version }}
                      type=raw,value=latest

            - name: Build and push with SBOM + provenance attestations
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              with:
                  context: backend
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  sbom: true
                  provenance: mode=max

            - name: Download release assets
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  name: release-assets
                  path: release-assets

            - name: Generate changelog from conventional commits
              run: |
                  PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
                  RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"
                  echo "Previous tag: ${PREV_TAG:-<none>}"
                  bash .github/scripts/generate-changelog.sh "$RANGE" > changelog.md
                  cat changelog.md

            - name: Create git tag and GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cat > release-notes.md <<'EOF'
                  ## Frontend (GitHub Pages, deployed with this release)

                  - Static site published to Pages (see Deployments on this page / Settings → Pages)

                  ## Backend image (multi-arch linux/amd64 + linux/arm64, with SBOM + SLSA provenance)

                  ```
                  ghcr.io/${{ github.repository }}-backend:${{ inputs.version }}
                  ghcr.io/${{ github.repository }}-backend:latest
                  ```
                  - SBOM attestation: dependency manifest of the image
                  - SLSA provenance (mode=max): build source, trigger, source repo and build commands
                  - Verify with: `docker buildx imagetools inspect ghcr.io/${{ github.repository }}-backend:${{ inputs.version }} --format '{{json .Manifest.Digest}}'` and check the Attestations tab on the GHCR package page

                  ## Cross-platform artifacts

                  - `mma-guessr-frontend-${{ inputs.version }}.zip`: frontend static package, unzip on any platform and open `src/index.html` or serve it from any static server
                  - `mma-guessr-backend-${{ inputs.version }}.zip`: backend Go single binaries for linux/darwin/windows × amd64/arm64 (inside `bin/`), no runtime dependencies, run `./mma-guessr-<os>-<arch>` with env vars from `.env.example`
                  - `SHA256SUMS.txt`: artifact checksums

                  ## Changelog
                  EOF
                  cat changelog.md >> release-notes.md
                  gh release create "v${{ inputs.version }}" \
                    --title "Release v${{ inputs.version }}" \
                    --notes-file release-notes.md \
                    release-assets/*