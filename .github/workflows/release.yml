name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version (e.g. 1.0.0; creates tag v1.0.0 and pushes image ghcr.io/...-backend:1.0.0)
                required: true
                type: string
            includeIntegration:
                description: Run integration tests (PG + Redis full flow) before publishing
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    quality:
        name: Quality gates + integration tests
        uses: ./.github/workflows/backend-checks.yml
        with:
            runIntegration: ${{ inputs.includeIntegration }}

    publish:
        name: Push image / tag / create Release
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            actions: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-backend
                  tags: |
                      type=raw,value=${{ inputs.version }}
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create git tag and GitHub Release
              run: |
                  gh release create "v${{ inputs.version }}" \
                    --title "Release v${{ inputs.version }}" \
                    --notes "Image: ghcr.io/${{ github.repository }}-backend:${{ inputs.version }}" \
                    --generate-notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}