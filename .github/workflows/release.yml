name: Release 发布

on:
    workflow_dispatch:
        inputs:
            version:
                description: 发布版本号（例如 1.0.0，将打 v1.0.0 标签并推送镜像 ghcr.io/...-backend:1.0.0）
                required: true
                type: string
            includeIntegration:
                description: 发布前运行集成测试（PG + Redis 全流程）
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    quality:
        name: 代码质量 + 集成测试
        uses: ./.github/workflows/backend-checks.yml
        with:
            runIntegration: ${{ inputs.includeIntegration }}

    publish:
        name: 推送镜像 / 打标签 / 创建 Release
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            actions: write
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 登录 GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 提取镜像元数据
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-backend
                  tags: |
                      type=raw,value=${{ inputs.version }}
                      type=raw,value=latest

            - name: 构建并推送
              uses: docker/build-push-action@v6
              with:
                  context: backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: 创建 Git 标签与 GitHub Release
              run: |
                  gh release create "v${{ inputs.version }}" \
                    --title "Release v${{ inputs.version }}" \
                    --notes "镜像：ghcr.io/${{ github.repository }}-backend:${{ inputs.version }}" \
                    --generate-notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}