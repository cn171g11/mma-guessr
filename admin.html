<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MmaGuessr · 管理员面板</title>
<style>
  :root{
    --bg:#0f1220; --card:#1a1f35; --line:#2a3150; --txt:#e7ebf5; --muted:#9aa3c0;
    --accent:#5b8cff; --ok:#36d399; --bad:#f87272; --chip:#222a47;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2b4d 0,transparent 60%),var(--bg);color:var(--txt);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  #login .card{width:360px;text-align:center}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0e1224;color:var(--txt);font-size:15px;outline:none}
  input[type=password]:focus{border-color:var(--accent)}
  button{cursor:pointer;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;width:100%;margin-top:14px}
  button:hover{filter:brightness(1.08)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px}
  .lock{font-size:34px;margin-bottom:6px}
  /* panel */
  #panel{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--txt)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filters input,.filters select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#0e1224;color:var(--txt);font-size:14px}
  .filters input{flex:1;min-width:200px}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);width:auto;margin:0;padding:9px 14px}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
  thead th{position:sticky;top:0;background:#161b30;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:#141a30}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .diff{display:inline-block;min-width:18px;text-align:center;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;color:#0b0e18}
  .d1{background:#36d399}.d2{background:#7dd3fc}.d3{background:#fbbf24}.d4{background:#fb923c}.d5{background:#f87272}
  .region{color:var(--muted)}
  tr.grp td{background:#141a30;color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.4px;padding:9px 14px;border-top:2px solid var(--line)}
  tr.grp:first-child td{border-top:none}
  .foot{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
  .note{background:#1a1430;border:1px solid #3a2a55;border-radius:10px;padding:10px 12px;color:#cbb6ff;font-size:12px;margin-top:14px}
  @media (max-width:560px){.wrap{padding:12px}.tbl-wrap{border-radius:10px}}
</style>
</head>
<body>

<!-- ===== Login gate ===== -->
<div id="login">
  <div class="card">
    <div class="lock">🔐</div>
    <h1>管理员面板</h1>
    <div class="sub">MmaGuessr · 受限访问</div>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="pw" placeholder="请输入管理员密码" autofocus>
      <button type="submit" id="enterBtn">进入面板</button>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>

<!-- ===== Admin panel ===== -->
<div id="panel" class="wrap">
  <div class="topbar">
    <div>
      <h1 style="margin:0">🌍 MmaGuessr · 街景坐标管理</h1>
      <div class="sub" style="margin:2px 0 0">仅管理员可见 · 数据经 AES-256-GCM 加密，运行时解密</div>
    </div>
    <button class="btn-ghost" id="logoutBtn" style="width:auto">退出登录</button>
  </div>

  <div class="stats">
    <span class="chip">地点总数：<b id="count">—</b></span>
    <span class="chip">纬度范围：<b id="latRange">—</b></span>
    <span class="chip">经度范围：<b id="lngRange">—</b></span>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="按地点名称搜索…">
    <select id="fRegion">
      <option value="">全部区域</option>
      <option value="europe">欧洲</option>
      <option value="asia">亚洲</option>
      <option value="northamerica">北美</option>
      <option value="southamerica">南美</option>
      <option value="oceania">大洋洲</option>
      <option value="africa">非洲</option>
    </select>
    <select id="fCountry">
      <option value="">全部国家</option>
    </select>
    <select id="fDiff">
      <option value="">全部难度</option>
      <option value="1">难度 1</option>
      <option value="2">难度 2</option>
      <option value="3">难度 3</option>
      <option value="4">难度 4</option>
      <option value="5">难度 5</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>地点名称</th><th>纬度 (lat)</th><th>经度 (lng)</th><th>区域</th><th>难度</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="note">
    ⚠️ 安全说明：本页为<strong>纯前端</strong>实现。密码不存储于页面（仅用于运行时派生密钥），
    坐标以密文形式内嵌、不会以明文出现在源码或开发者工具中。但因游戏本体需内置坐标才能运行，
    坐标同样存在于 <code>MmaGuessr.html</code> 内。若需对玩家彻底隐藏坐标，应将数据改由后端按权限下发。
  </div>
  <div class="foot" id="ctx"></div>
</div>

  var PBKDF2_ITER = 150000;

  // ---- Secure-context guard ----
  if (!window.crypto || !crypto.subtle) {
    document.getElementById('err') &&
      (document.getElementById('login').querySelector('.sub').textContent =
        '需在 HTTPS 或 localhost 下打开本页（加密 API 要求安全上下文）。');
    return;
  }

  function b64ToBytes(b64){
    var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
    for (var i=0;i<len;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function decryptWithPassword(password){
    var salt = b64ToBytes(SALT);
    var iv   = b64ToBytes(IV);
    var data = b64ToBytes(DATA);
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function(keyMat){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:salt, iterations:PBKDF2_ITER, hash:'SHA-256' },
          keyMat,
          { name:'AES-GCM', length:256 },
          false,
          ['decrypt']
        );
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, data);
      })
      .then(function(plainBuf){
        return JSON.parse(new TextDecoder().decode(plainBuf));
      });
  }

  var ALL = [];

  function render(){
    var q = (document.getElementById('search').value || '').trim().toLowerCase();
    var fr = document.getElementById('fRegion').value;
    var fc = document.getElementById('fCountry').value;
    var fd = document.getElementById('fDiff').value;
    var rows = document.getElementById('rows');
    rows.innerHTML = '';
    var n = 0;
    var groups = {};
    var order = [];
    ALL.forEach(function(loc){
      if (fr && loc.region !== fr) return;
      if (fc && loc.country !== fc) return;
      if (fd && String(loc.difficulty) !== fd) return;
      if (q && (loc.name||'').toLowerCase().indexOf(q) === -1) return;
      var c = loc.country || '其他';
      if (!groups[c]) { groups[c] = []; order.push(c); }
      groups[c].push(loc);
      n++;
    });
    order.sort(function(a,b){
      if (a === '中国') return -1;
      if (b === '中国') return 1;
      if (groups[b].length !== groups[a].length) return groups[b].length - groups[a].length;
      return a < b ? -1 : 1;
    });
    order.forEach(function(c){
      var list = groups[c];
      var gh = document.createElement('tr');
      gh.className = 'grp';
      gh.innerHTML = '<td colspan="6">📍 ' + escapeHtml(c) + '（' + list.length + '）</td>';
      rows.appendChild(gh);
      list.forEach(function(loc){
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="mono">'+(loc._idx+1)+'</td>'+
          '<td>'+escapeHtml(loc.name||'')+'</td>'+
          '<td class="mono">'+fmt(loc.lat)+'</td>'+
          '<td class="mono">'+fmt(loc.lng)+'</td>'+
          '<td class="region">'+escapeHtml(loc.region||'')+'</td>'+
          '<td><span class="diff d'+(loc.difficulty||1)+'">'+(loc.difficulty||1)+'</span></td>';
        rows.appendChild(tr);
      });
    });
    document.getElementById('count').textContent = n + ' / ' + ALL.length;
  }

  function fmt(v){ return (typeof v === 'number') ? v.toFixed(4) : (v==null?'':v); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function showPanel(locations){
    ALL = locations.map(function(l, i){ l._idx = i; return l; });
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    // ranges
    var lats = locations.map(function(l){return l.lat;}), lngs = locations.map(function(l){return l.lng;});
    document.getElementById('latRange').textContent = Math.min.apply(null,lats).toFixed(2)+' ~ '+Math.max.apply(null,lats).toFixed(2);
    document.getElementById('lngRange').textContent = Math.min.apply(null,lngs).toFixed(2)+' ~ '+Math.max.apply(null,lngs).toFixed(2);
    document.getElementById('ctx').textContent = '数据已解密并显示 · 渲染时间 '+new Date().toLocaleString();
    // 国家筛选下拉（按数量排序，中国置顶）
    var cCount = {};
    ALL.forEach(function(l){ var c = l.country || '其他'; cCount[c] = (cCount[c]||0)+1; });
    var cs = Object.keys(cCount).sort(function(a,b){
      if (a === '中国') return -1; if (b === '中国') return 1;
      if (cCount[b] !== cCount[a]) return cCount[b]-cCount[a];
      return a < b ? -1 : 1;
    });
    var sel = document.getElementById('fCountry');
    cs.forEach(function(c){ var o = document.createElement('option'); o.value = c; o.textContent = c + '（' + cCount[c] + '）'; sel.appendChild(o); });
    ['search','fRegion','fCountry','fDiff'].forEach(function(id){
      document.getElementById(id).addEventListener('input', render);
      document.getElementById(id).addEventListener('change', render);
    });
    render();
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var errEl = document.getElementById('err');
    var btn = document.getElementById('enterBtn');
    errEl.textContent = '';
    if (!pw){ errEl.textContent = '请输入密码。'; return; }
    btn.disabled = true; btn.textContent = '校验中…';
    decryptWithPassword(pw).then(function(locations){
      btn.disabled = false; btn.textContent = '进入面板';
      showPanel(locations);
    }).catch(function(){
      btn.disabled = false; btn.textContent = '进入面板';
      errEl.textContent = '密码错误或无权限访问。';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    location.reload();
  });
})();
</script>
